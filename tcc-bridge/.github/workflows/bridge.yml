name: Build Bridge for Android

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build bridge (aarch64-linux-android)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: aarch64-linux-android

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: r27c

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-

      - name: Build bridge
        run: cargo build --release --target aarch64-linux-android

      - name: Verify binary
        run: |
          ls -la target/aarch64-linux-android/release/tcc-bridge

      - name: Upload bridge binary
        uses: actions/upload-artifact@v4
        with:
          name: tcc-bridge-aarch64-linux-android
          path: target/aarch64-linux-android/release/tcc-bridge
          retention-days: 7