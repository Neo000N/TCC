[package]
name = "tcc-bridge"
version = "0.1.0"
edition = "2021"

[dependencies]
# PTY management
portable-pty = { version = "0.8", features = ["serde"] }

# Async runtime
tokio = { version = "1.38", features = ["full", "net", "signal", "fs", "io-std", "process", "time", "macros"] }

# WebSocket
tungstenite = "0.21"
futures = "0.3"

# HTTP server
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
hyper = { version = "1.1", features = ["full", "server", "client", "http1", "http2"] }
http = "1.1"
hyper-util = { version = "0.1", features = ["tokio", "service", "client-legacy"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# TLS certificates
rcgen = "0.11"
rustls = { version = "0.23", features = ["logging"] }
tokio-rustls = { version = "0.26", features = ["default"] }

# Configuration
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Utilities
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
base64 = { version = "0.22", features = ["std"] }
sha2 = "0.10"

# CLI
clap = { version = "4.5", features = ["derive"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
