name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Debug Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          which java

      - name: Accept Android SDK licenses
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Install Android SDK components
        run: |
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Debug gradlew script
        run: |
          chmod +x ./gradlew
          ls -la ./gradlew
          ls -la gradle/wrapper/gradle-wrapper.jar
          echo "=== Running gradlew --version ==="
          ./gradlew --version
          echo "=== gradlew --version exit code: $? ==="

      - name: Debug java direct
        run: |
          echo "=== Running java -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain --version ==="
          java -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain --version
          echo "=== java direct exit code: $? ==="

      - name: Debug gradlew assembleDebug
        run: |
          echo "=== Running gradlew assembleDebug ==="
          ./gradlew assembleDebug --no-daemon --stacktrace
          echo "=== gradlew assembleDebug exit code: $? ==="

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7