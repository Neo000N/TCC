name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle
      
      - name: Accept Android SDK licenses
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Install Android SDK components
        run: |
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Check available Gradle
        run: |
          which gradle
          gradle --version || echo "Gradle not in PATH"
          ls -la /opt/gradle* 2>/dev/null || echo "No /opt/gradle"
          ls -la /usr/lib/gradle* 2>/dev/null || echo "No /usr/lib/gradle"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          if command -v gradle &> /dev/null; then
            echo "Using system Gradle"
            gradle assembleDebug --no-daemon --stacktrace
          else
            echo "Using Gradle wrapper"
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi
      
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
